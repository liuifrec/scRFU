name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            pandas: "pandas==2.3.3"
          - python-version: "3.11"
            pandas: "pandas==2.3.3"
          - python-version: "3.12"
            pandas: "pandas==3.1.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[all,test]" "${{ matrix.pandas }}" openpyxl pyarrow scikit-learn
      - run: python -c "import scrfu; print(scrfu.__version__)"
      - name: Python software suite (external R checks run separately)
        run: python tools/run_installed_tests.py --python-only
      - run: ruff check src tests examples tools docs/conf.py
      - run: ruff format --check src tests examples tools docs/conf.py

  os-smoke:
    name: Core smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -c "import scrfu; print(scrfu.__version__)"
      - run: scrfu --help
      - run: scrfu doctor
      - run: >-
          python -m pytest -q
          tests/test_tutorial.py -k "not test_scverse_tutorial_when_optional_stack_is_installed"
          tests/test_receptor_schema_adapters.py
          tests/test_repertoire_metrics.py
          tests/test_longitudinal.py
          tests/test_transfer_benchmark_comparators.py
          tests/test_vdjdb_reference_matching.py
          tests/test_bcr.py
      - run: python examples/tutorial_end_to_end.py --outdir "${{ runner.temp }}/scrfu-tutorial"

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_distributions.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[docs]"
      - run: sphinx-build -E -W --keep-going -b html docs docs/_build/html

  optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[scirpy,mudata,plotting,test]"
      - run: python -c "import awkward, matplotlib, mudata, scanpy, scirpy, scrfu; print(scrfu.__version__)"
      - run: python -m pytest -q tests/test_bcr.py tests/test_plotting.py tests/test_scverse_native.py
      - run: python examples/tutorial_scverse_native.py --outdir "${{ runner.temp }}/scrfu-scverse-tutorial"
