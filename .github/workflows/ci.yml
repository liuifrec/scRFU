name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[plotting,test]"
      - run: python -c "import scrfu; print(scrfu.__version__)"
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/scrfu-wheel-smoke
      - run: /tmp/scrfu-wheel-smoke/bin/python -m pip install dist/*.whl
      - run: |
          cd /tmp
          /tmp/scrfu-wheel-smoke/bin/python - <<'PY'
          import pandas as pd
          import scrfu

          receptors = pd.DataFrame({
              "input_row_id": ["r1", "r2"],
              "cell_id": ["c1", "c2"],
              "chain": ["TRB", "TRB"],
              "cdr3aa": ["CASSF", "CASRF"],
              "v_call": ["TRBV1", "TRBV2"],
              "sample": ["s1", "s2"],
              "rfu_label": ["RFU1", "RFU2"],
              "pass_thr": [True, True],
          })
          scrfu.pp.validate_receptor_table(receptors, strict=False)
          result = scrfu.tl.rfu_pseudobulk(receptors, sample_key="sample")
          assert result.matrix.shape == (2, 2)
          print(scrfu.__version__)
          PY
      - run: /tmp/scrfu-wheel-smoke/bin/scrfu --help
