name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[plotting,test]"
      - run: python -c "import scrfu; print(scrfu.__version__)"
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .

  os-smoke:
    name: Core smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -c "import scrfu; print(scrfu.__version__)"
      - run: scrfu --help
      - run: scrfu doctor
      - run: >-
          python -m pytest -q
          tests/test_tutorial.py
          tests/test_receptor_schema_adapters.py
          tests/test_repertoire_metrics.py
          tests/test_longitudinal.py
          tests/test_transfer_benchmark_comparators.py
          tests/test_vdjdb_reference_matching.py
          tests/test_bcr.py
      - run: python examples/tutorial_end_to_end.py --outdir "${{ runner.temp }}/scrfu-tutorial"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/scrfu-wheel-smoke
      - run: /tmp/scrfu-wheel-smoke/bin/python -m pip install dist/*.whl
      - run: |
          cd /tmp
          /tmp/scrfu-wheel-smoke/bin/python - <<'PY'
          import pandas as pd
          import scrfu

          receptors = pd.DataFrame({
              "input_row_id": ["r1", "r2"],
              "cell_id": ["c1", "c2"],
              "chain": ["TRB", "TRB"],
              "cdr3aa": ["CASSF", "CASRF"],
              "v_call": ["TRBV1", "TRBV2"],
              "sample": ["s1", "s2"],
              "rfu_label": ["RFU1", "RFU2"],
              "pass_thr": [True, True],
          })
          scrfu.pp.validate_receptor_table(receptors, strict=False)
          result = scrfu.tl.rfu_pseudobulk(receptors, sample_key="sample")
          assert result.matrix.shape == (2, 2)
          print(scrfu.__version__, scrfu.__file__)
          PY
      - run: /tmp/scrfu-wheel-smoke/bin/scrfu --help
      - run: |
          cd /tmp
          /tmp/scrfu-wheel-smoke/bin/python \
            "$GITHUB_WORKSPACE/examples/tutorial_end_to_end.py" \
            --outdir /tmp/scrfu-tutorial-smoke
          test -s /tmp/scrfu-tutorial-smoke/run_manifest.json
      - run: python -m venv /tmp/scrfu-sdist-smoke
      - run: /tmp/scrfu-sdist-smoke/bin/python -m pip install dist/*.tar.gz
      - run: |
          cd /tmp
          /tmp/scrfu-sdist-smoke/bin/python -c \
            "import scrfu; print(scrfu.__version__, scrfu.__file__)"
          /tmp/scrfu-sdist-smoke/bin/scrfu --version
          /tmp/scrfu-sdist-smoke/bin/python \
            "$GITHUB_WORKSPACE/examples/tutorial_end_to_end.py" \
            --outdir /tmp/scrfu-sdist-tutorial

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[docs]"
      - run: sphinx-build -E -W --keep-going -b html docs docs/_build/html

  optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[mudata,plotting,test]"
      - run: python -c "import matplotlib, mudata, scrfu; print(scrfu.__version__)"
      - run: python -m pytest -q tests/test_bcr.py tests/test_plotting.py
