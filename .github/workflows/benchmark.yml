name: Synthetic performance benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: >-
          python examples/synthetic_scaling_benchmark.py
          --rows 10000 100000
          --outdir "${{ runner.temp }}/scrfu-benchmark"
      - run: >-
          python examples/compare_benchmark_baseline.py
          --baseline benchmarks/synthetic_python_baseline.tsv
          --current "${{ runner.temp }}/scrfu-benchmark/synthetic_scaling.tsv"
