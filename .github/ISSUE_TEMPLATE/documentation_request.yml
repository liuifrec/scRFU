name: Documentation request
description: Request a correction, example, tutorial, or API clarification
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes: {label: Page or public symbol}
    validations: {required: true}
  - type: textarea
    id: gap
    attributes: {label: Current ambiguity or missing information}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Proposed acceptance criterion}
    validations: {required: true}
